[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "atechnika-kp-bot"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
 "aiogram>=3.20,<4", "SQLAlchemy>=2.0,<2.1", "psycopg[binary]>=3.2,<4",
 "alembic>=1.15,<2", "docxtpl>=0.20,<0.21", "boto3>=1.35,<2",
 "openai>=2,<3", "pydantic-settings>=2.8,<3", "httpx>=0.28,<1", "defusedxml>=0.7,<1"
]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11"]
[tool.setuptools.packages.find]
include = ["bp_bot*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
